# Pinnacle Chat + CRM: Twenty CRM embedded in a self-hosted, Discord-style chat (Matrix/Element).
#   chat.DOMAIN   -> Element (the chat app)
#   crm.DOMAIN    -> Twenty CRM (also embedded as a tab inside chat rooms)
#   matrix.DOMAIN -> Synapse (chat server, federation disabled = private)
#   hooks.DOMAIN  -> bridge that posts Twenty events (new leads, etc.) into a chat room
name: pinnacle

services:
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: always

  # ---------- Twenty CRM (from twentyhq/twenty packages/twenty-docker) ----------
  twenty-server:
    image: twentycrm/twenty:${TAG:-latest}
    volumes:
      - twenty-local-data:/app/packages/twenty-server/.local-storage
    environment: &twenty-env
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://postgres:${PG_DATABASE_PASSWORD}@db:5432/default
      SERVER_URL: https://crm.${DOMAIN}
      REDIS_URL: redis://redis:6379
      STORAGE_TYPE: local
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  twenty-worker:
    image: twentycrm/twenty:${TAG:-latest}
    volumes:
      - twenty-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      db: { condition: service_healthy }
      twenty-server: { condition: service_healthy }
    restart: always

  db:
    image: postgres:16
    volumes:
      - twenty-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    healthcheck:
      test: pg_isready -U postgres -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  # ---------- Chat (Matrix Synapse + Element web) ----------
  synapse:
    image: matrixdotorg/synapse:latest
    volumes:
      - ./synapse/data:/data
    depends_on:
      synapse-db: { condition: service_healthy }
    restart: always

  synapse-db:
    image: postgres:16
    volumes:
      - synapse-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${SYNAPSE_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    healthcheck:
      test: pg_isready -U synapse -h localhost -d synapse
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  element:
    image: vectorim/element-web:latest
    environment:
      ELEMENT_WEB_PORT: 80
    volumes:
      - ./element/config.json:/app/config.json:ro
    restart: always

  # ---------- Twenty -> chat notifications ----------
  bridge:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "bridge.js"]
    volumes:
      - ./bridge:/app:ro
    environment:
      MATRIX_URL: http://synapse:8008
      MATRIX_TOKEN: ${MATRIX_BOT_TOKEN}
      MATRIX_ROOM_ID: ${MATRIX_LEADS_ROOM_ID}
      HOOK_SECRET: ${HOOK_SECRET}
      CRM_URL: https://crm.${DOMAIN}
      FORWARD_EVENTS: ${FORWARD_EVENTS:-person.created,opportunity.created,task.created}
    restart: always

volumes:
  caddy-data:
  twenty-db:
  twenty-local-data:
  synapse-db:
